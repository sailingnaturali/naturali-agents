[project]
name = "naturali-agents"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.97",
    "httpx>=0.27",
    "paho-mqtt>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.23",
    "jinja2>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
